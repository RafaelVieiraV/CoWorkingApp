name: CD — Deploy a Render

on:
  workflow_run:
    workflows: ["CI - CoWorking App"]
    types:
      - completed
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Build y generar JAR
        run: ./gradlew build --no-daemon -x test

      - name: Publicar JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coworking-app-jar
          path: build/libs/*.jar

      - name: Trigger deploy en Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "✅ Deploy disparado en Render"